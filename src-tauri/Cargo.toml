[package]
name = "lightline"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Timeline light-show editor and music visualizer for Govee LAN lights"

[build-dependencies]
embed-resource = "3"

[dependencies]
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Foundation_Collections"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
rustfft = "6"
cpal = "0.15"
rfd = "0.15"
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "clipboard", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
